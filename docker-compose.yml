services:
  mysql:
    image: mysql:8.0
    container_name: jewelry_mysql
    restart: always
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - jewelry_network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jewelry_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - jewelry_network

  wordpress:
    build:
      context: ./docker/wordpress
      dockerfile: Dockerfile
    image: jewelry_wordpress:6.9-php8.1-redis
    container_name: jewelry_wordpress
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
    volumes:
      - ./data/wordpress:/var/www/html
    networks:
      - jewelry_network
      - traefik-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/wp-login.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      # Router local (jewelry.local.dev)
      - "traefik.http.routers.jewelry.rule=Host(`jewelry.local.dev`)"
      - "traefik.http.routers.jewelry.entrypoints=websecure"
      - "traefik.http.routers.jewelry.tls=true"
      # Router local (tujoyita.local — /etc/hosts)
      - "traefik.http.routers.jewelry-local.rule=Host(`tujoyita.local`)"
      - "traefik.http.routers.jewelry-local.entrypoints=websecure"
      - "traefik.http.routers.jewelry-local.tls=true"
      - "traefik.http.routers.jewelry-local-http.rule=Host(`tujoyita.local`)"
      - "traefik.http.routers.jewelry-local-http.entrypoints=web"
      # Router público (acceso externo via Cloudflare Tunnel)
      - "traefik.http.routers.jewelry-public.rule=Host(`dev.tujoyita.com`)"
      - "traefik.http.routers.jewelry-public.entrypoints=websecure"
      - "traefik.http.routers.jewelry-public.tls=true"
      # Router HTTP para Cloudflare Tunnel (llega por puerto 80)
      - "traefik.http.routers.jewelry-tunnel.rule=Host(`dev.tujoyita.com`)"
      - "traefik.http.routers.jewelry-tunnel.entrypoints=web"
      # Servicio compartido
      - "traefik.http.services.jewelry.loadbalancer.server.port=80"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: jewelry_phpmyadmin
    restart: always
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      # No PMA_USER/PMA_PASSWORD — requires manual login (no auto-root)
      UPLOAD_LIMIT: 100M
    networks:
      - jewelry_network
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.jewelry-phpmyadmin.rule=Host(`phpmyadmin.jewelry.local.dev`)"
      - "traefik.http.routers.jewelry-phpmyadmin.entrypoints=websecure"
      - "traefik.http.routers.jewelry-phpmyadmin.tls=true"
      # Basic auth middleware (user: admin, password: jewelry2026)
      - "traefik.http.routers.jewelry-phpmyadmin.middlewares=phpmyadmin-auth@docker"
      - "traefik.http.middlewares.phpmyadmin-auth.basicauth.users=admin:$$2y$$05$$6xEWIAEAJmfhgOLgLYw/rOtT4N3YOr0bDs8NdFKac2SSbKIJdDjOC"
      - "traefik.http.services.jewelry-phpmyadmin.loadbalancer.server.port=80"

  wpcli:
    image: wordpress:cli
    container_name: jewelry_wpcli
    depends_on:
      - mysql
      - wordpress
    volumes:
      - ./data/wordpress:/var/www/html
    networks:
      - jewelry_network
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}

  dashboard:
    image: nginx:alpine
    container_name: jewelry_dashboard
    restart: always
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./dashboard/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard/nginx/wc-auth.conf:/etc/nginx/wc-auth.conf:ro
    networks:
      - jewelry_network
      - traefik-public
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.jewelry-dashboard.rule=Host(`dashboard.jewelry.local.dev`)"
      - "traefik.http.routers.jewelry-dashboard.entrypoints=websecure"
      - "traefik.http.routers.jewelry-dashboard.tls=true"
      # Router local (dashboard.tujoyita.local — /etc/hosts)
      - "traefik.http.routers.jewelry-dashboard-local.rule=Host(`dashboard.tujoyita.local`)"
      - "traefik.http.routers.jewelry-dashboard-local.entrypoints=websecure"
      - "traefik.http.routers.jewelry-dashboard-local.tls=true"
      - "traefik.http.routers.jewelry-dashboard-local-http.rule=Host(`dashboard.tujoyita.local`)"
      - "traefik.http.routers.jewelry-dashboard-local-http.entrypoints=web"
      # Path-based route: tujoyita.local/dashboard/
      - "traefik.http.routers.jewelry-dashboard-path-local.rule=Host(`tujoyita.local`) && PathPrefix(`/dashboard/`)"
      - "traefik.http.routers.jewelry-dashboard-path-local.entrypoints=websecure"
      - "traefik.http.routers.jewelry-dashboard-path-local.tls=true"
      - "traefik.http.routers.jewelry-dashboard-path-local.priority=300"
      - "traefik.http.routers.jewelry-dashboard-path-local.middlewares=jewelry-dashboard-strip@docker"
      - "traefik.http.routers.jewelry-dashboard-path-local-http.rule=Host(`tujoyita.local`) && PathPrefix(`/dashboard/`)"
      - "traefik.http.routers.jewelry-dashboard-path-local-http.entrypoints=web"
      - "traefik.http.routers.jewelry-dashboard-path-local-http.priority=300"
      - "traefik.http.routers.jewelry-dashboard-path-local-http.middlewares=jewelry-dashboard-strip@docker"
      - "traefik.http.routers.jewelry-dashboard-public.rule=Host(`dashboard.dev.tujoyita.com`)"
      - "traefik.http.routers.jewelry-dashboard-public.entrypoints=websecure"
      - "traefik.http.routers.jewelry-dashboard-public.tls=true"
      - "traefik.http.routers.jewelry-dashboard-path-public.rule=Host(`dev.tujoyita.com`) && PathPrefix(`/dashboard/`)"
      - "traefik.http.routers.jewelry-dashboard-path-public.entrypoints=websecure"
      - "traefik.http.routers.jewelry-dashboard-path-public.tls=true"
      - "traefik.http.routers.jewelry-dashboard-path-public.priority=300"
      - "traefik.http.routers.jewelry-dashboard-path-public.middlewares=jewelry-dashboard-strip@docker"
      - "traefik.http.routers.jewelry-dashboard-path-public-redirect.rule=Host(`dev.tujoyita.com`) && Path(`/dashboard`)"
      - "traefik.http.routers.jewelry-dashboard-path-public-redirect.entrypoints=websecure"
      - "traefik.http.routers.jewelry-dashboard-path-public-redirect.tls=true"
      # Routers HTTP para Cloudflare Tunnel (llega por puerto 80)
      - "traefik.http.routers.jewelry-dashboard-tunnel.rule=Host(`dev.tujoyita.com`) && PathPrefix(`/dashboard/`)"
      - "traefik.http.routers.jewelry-dashboard-tunnel.entrypoints=web"
      - "traefik.http.routers.jewelry-dashboard-tunnel.priority=300"
      - "traefik.http.routers.jewelry-dashboard-tunnel.middlewares=jewelry-dashboard-strip@docker"
      - "traefik.http.routers.jewelry-dashboard-tunnel-redirect.rule=Host(`dev.tujoyita.com`) && Path(`/dashboard`)"
      - "traefik.http.routers.jewelry-dashboard-tunnel-redirect.entrypoints=web"
      - "traefik.http.routers.jewelry-dashboard-tunnel-redirect.priority=301"
      - "traefik.http.routers.jewelry-dashboard-tunnel-redirect.middlewares=jewelry-dashboard-addslash@docker"
      - "traefik.http.routers.jewelry-dashboard-path-public-redirect.priority=301"
      - "traefik.http.routers.jewelry-dashboard-path-public-redirect.middlewares=jewelry-dashboard-addslash@docker"
      - "traefik.http.middlewares.jewelry-dashboard-strip.stripprefix.prefixes=/dashboard"
      - "traefik.http.middlewares.jewelry-dashboard-addslash.redirectregex.regex=^https?://([^/]+)/dashboard$"
      - "traefik.http.middlewares.jewelry-dashboard-addslash.redirectregex.replacement=https://$${1}/dashboard/"
      - "traefik.http.middlewares.jewelry-dashboard-addslash.redirectregex.permanent=true"
      - "traefik.http.services.jewelry-dashboard.loadbalancer.server.port=80"

networks:
  jewelry_network:
    driver: bridge
  traefik-public:
    external: true

volumes:
  redis_data:
