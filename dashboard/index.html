<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jewelry Dashboard — Catálogo WooCommerce</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>"
    />
    <link rel="stylesheet" href="css/dashboard.css?v=2.0.2" />
  </head>
  <body>
    <div id="jewd-app" class="jewd-wrap">
      <!-- TOPBAR -->
      <div class="jewd-topbar">
        <h1 class="jewd-title">
          <span class="jewd-icon">💎</span>
          Jewelry Dashboard
          <span class="jewd-version" id="versionTag">v2.0.0</span>
        </h1>
        <div class="jewd-actions">
          <button
            class="jewd-btn jewd-btn-outline jewd-btn-sm"
            id="btnExpandAll"
            title="Expandir/Colapsar todo"
          >
            ⊞ Expandir Todo
          </button>
          <button
            class="jewd-btn jewd-btn-outline jewd-btn-sm"
            id="btnExportJSON"
            title="Exportar JSON"
          >
            ⬇ JSON
          </button>
          <button
            class="jewd-btn jewd-btn-outline jewd-btn-sm"
            id="btnExportCSV"
            title="Exportar CSV"
          >
            📊 CSV
          </button>
          <button
            class="jewd-btn jewd-btn-outline jewd-btn-sm"
            id="btnRefresh"
            title="Refrescar datos"
          >
            🔄 Refrescar
          </button>
          <a
            class="jewd-btn jewd-btn-outline jewd-btn-sm"
            id="btnWPAdmin"
            href="#"
            target="_blank"
            title="Ir a WP Admin"
          >
            ⚙ WP Admin
          </a>
          <button class="jewd-btn-theme" id="btnTheme" title="Cambiar tema">
            🌙
          </button>
        </div>
      </div>

      <!-- CONNECTION STATUS -->
      <div class="jewd-connection" id="connectionStatus">
        <span class="jewd-conn-dot"></span>
        <span id="connText">Conectando a WooCommerce...</span>
      </div>

      <!-- STATS -->
      <div class="jewd-stats" id="statsContainer">
        <div class="jewd-stat jewd-loading-pulse">
          <div class="jewd-stat-label">Cargando...</div>
          <div class="jewd-stat-value">—</div>
        </div>
      </div>

      <!-- FILTERS -->
      <div class="jewd-filters">
        <input
          type="text"
          id="filterSearch"
          class="jewd-input"
          placeholder="🔍 Buscar nombre, SKU, categoría..."
        />
        <select id="filterCategory" class="jewd-select">
          <option value="">Todas categorías</option>
        </select>
        <select id="filterType" class="jewd-select">
          <option value="">Todos tipos</option>
          <option value="variable">Variable</option>
          <option value="simple">Simple</option>
        </select>
        <select id="filterStock" class="jewd-select">
          <option value="">Todo stock</option>
          <option value="instock">En stock</option>
          <option value="outofstock">Sin stock</option>
        </select>
        <span class="jewd-filter-count" id="filterCount"></span>
      </div>

      <!-- TABLE -->
      <div class="jewd-table-wrap">
        <table class="jewd-table">
          <thead>
            <tr>
              <th style="width: 30px"></th>
              <th style="width: 44px">Img</th>
              <th>SKU</th>
              <th>Nombre</th>
              <th>Tipo</th>
              <th>Categoría</th>
              <th class="jewd-right">Precio</th>
              <th class="jewd-right">Oferta</th>
              <th class="jewd-right">Stock</th>
              <th class="jewd-right">Peso</th>
              <th style="width: 100px" class="jewd-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="productsTable">
            <tr>
              <td colspan="11" class="jewd-loading-row">
                <div class="jewd-spinner"></div>
                Cargando catálogo desde WooCommerce...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- PAGINATION -->
      <div class="jewd-pagination" id="pagination"></div>

      <!-- DETAIL MODAL -->
      <div class="jewd-modal" id="detailModal">
        <div class="jewd-modal-dialog">
          <div class="jewd-modal-header">
            <h2 id="modalTitle">Detalle del Producto</h2>
            <button class="jewd-modal-close" id="modalClose">&times;</button>
          </div>
          <div class="jewd-modal-body" id="modalBody"></div>
          <div class="jewd-modal-footer">
            <a
              href="#"
              class="jewd-btn jewd-btn-outline"
              id="modalEditLink"
              target="_blank"
            >
              ✏️ Editar en WooCommerce
            </a>
            <a
              href="#"
              class="jewd-btn jewd-btn-outline"
              id="modalViewLink"
              target="_blank"
            >
              👁 Ver en Tienda
            </a>
            <button class="jewd-btn jewd-btn-gold" id="modalCloseBtn">
              Cerrar
            </button>
          </div>
        </div>
      </div>

      <!-- EDIT MODAL -->
      <div class="jewd-modal" id="editModal">
        <div class="jewd-modal-dialog jewd-modal-lg">
          <div class="jewd-modal-header">
            <h2 id="editModalTitle">✏️ Editar Producto</h2>
            <button class="jewd-modal-close" id="editModalClose">
              &times;
            </button>
          </div>
          <div class="jewd-modal-body" id="editModalBody"></div>
          <div class="jewd-modal-footer">
            <button class="jewd-btn jewd-btn-outline" id="editModalCancel">
              Cancelar
            </button>
            <button class="jewd-btn jewd-btn-gold" id="editModalSave">
              💾 Guardar Cambios
            </button>
          </div>
        </div>
      </div>

      <!-- IMAGE PREVIEW MODAL -->
      <div class="jewd-img-modal" id="imgModal">
        <img id="imgModalSrc" src="" alt="Preview" />
      </div>

      <!-- TOAST -->
      <div class="jewd-toast" id="toast"></div>
    </div>

    <!-- Config (gitignored — contains API keys) -->
    <script src=".env.js"></script>
    <!-- Application -->
    <script src="js/api.js?v=2.0.2"></script>
    <script src="js/dashboard.js?v=2.0.2"></script>
  </body>
</html>
