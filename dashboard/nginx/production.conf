server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Reverse proxy: /api/ → WordPress REST API ──
    # Dashboard container talks to WordPress container on internal Docker network.
    location /api/ {
        proxy_pass         http://tujoyita_wordpress/wp-json/;
        proxy_set_header   Host tujoyita.com;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Authorization $http_authorization;
        proxy_read_timeout 30s;
        proxy_buffering    off;
    }

    # ── Media proxy: /media/ → WordPress uploads ──
    location ^~ /media/ {
        proxy_pass         http://tujoyita_wordpress/wp-content/uploads/;
        proxy_set_header   Host tujoyita.com;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    on;
        expires            7d;
        add_header         Cache-Control "public, no-transform";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Cache versioned static assets
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Cache binary assets longer
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 256;
}
