server {
    listen 80;
    server_name dashboard.jewelry.local.dev dashboard.dev.tujoyita.com dashboard.tujoyita.local;

    root /usr/share/nginx/html;
    index index.html;

    # ── WC API credentials (server-side only, never sent to browser) ──
    include /etc/nginx/wc-auth.conf;

    # ── WooCommerce REST API: inject WC keys server-side ──
    # Browser sends only JWT; Nginx adds WC Basic auth before proxying.
    location /api/wc/ {
        proxy_pass         http://jewelry_wordpress/wp-json/wc/;
        proxy_set_header   Host tujoyita.local;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # Save JWT as custom header (Authorization is overwritten with WC keys)
        proxy_set_header   X-Dashboard-JWT $http_authorization;
        proxy_set_header   Authorization $wc_basic_auth;
        proxy_read_timeout 30s;
        proxy_buffering    off;
    }

    # ── WC Analytics API: same WC key injection ──
    location /api/wc-analytics/ {
        proxy_pass         http://jewelry_wordpress/wp-json/wc-analytics/;
        proxy_set_header   Host tujoyita.local;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Dashboard-JWT $http_authorization;
        proxy_set_header   Authorization $wc_basic_auth;
        proxy_read_timeout 30s;
        proxy_buffering    off;
    }

    # ── Custom REST API (jewd/v1/*): pass JWT directly ──
    # No WC keys needed — our PHP endpoints authenticate via JWT.
    location /api/ {
        proxy_pass         http://jewelry_wordpress/wp-json/;
        proxy_set_header   Host tujoyita.local;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Authorization $http_authorization;
        proxy_read_timeout 30s;
        proxy_buffering    off;
    }

    # ── Media proxy: /media/ → WordPress uploads ──
    # Rewrites product image URLs to same-origin to avoid DNS/cert issues.
    # ^~ prevents regex locations from overriding this match.
    location ^~ /media/ {
        proxy_pass         http://jewelry_wordpress/wp-content/uploads/;
        proxy_set_header   Host tujoyita.local;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    on;
        expires            7d;
        add_header         Cache-Control "public, no-transform";
    }

    # SPA fallback — HTML must not be cached long (cache-bust via query strings).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Service Worker MUST NOT be cached (browser needs fresh copy to detect updates).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
    }

    # Cache purge script MUST NOT be cached (needs to run fresh every time).
    location = /cache-purge.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
    }

    # Nuclear option: visit /clear-cache to wipe everything.
    # The Clear-Site-Data header tells the browser to delete cache + SW + cookies.
    location = /clear-cache {
        default_type text/html;
        add_header Clear-Site-Data '"cache", "storage"' always;
        add_header Cache-Control "no-store" always;
        return 200 '<!DOCTYPE html><html><head><meta charset=utf-8><meta http-equiv="refresh" content="2;url=/"></head><body style="background:#0f172a;color:#d4a843;display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui"><p>Cache limpiado. Redirigiendo...</p></body></html>';
    }

    # Cache versioned static assets (browsers & CDN bust via ?v=X.Y.Z).
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Cache binary assets longer.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; frame-ancestors 'self'" always;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 256;
}
