server {
    listen 80;
    server_name dashboard.jewelry.local.dev dashboard.dev.tujoyita.com dashboard.tujoyita.local;

    root /usr/share/nginx/html;
    index index.html;

    # ── Reverse proxy: /api/ → WordPress REST API ──
    # Eliminates CORS and self-signed cert issues for browser fetch().
    location /api/ {
        proxy_pass         http://jewelry_wordpress/wp-json/;
        proxy_set_header   Host tujoyita.local;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Authorization $http_authorization;
        proxy_read_timeout 30s;
        proxy_buffering    off;
    }

    # ── Media proxy: /media/ → WordPress uploads ──
    # Rewrites product image URLs to same-origin to avoid DNS/cert issues.
    # ^~ prevents regex locations from overriding this match.
    location ^~ /media/ {
        proxy_pass         http://jewelry_wordpress/wp-content/uploads/;
        proxy_set_header   Host tujoyita.local;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    on;
        expires            7d;
        add_header         Cache-Control "public, no-transform";
    }

    # SPA fallback — HTML must not be cached long (cache-bust via query strings).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Cache versioned static assets (browsers & CDN bust via ?v=X.Y.Z).
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Cache binary assets longer.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 256;
}
