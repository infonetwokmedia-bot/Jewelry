# GitHub Copilot Workspace Configuration
# Jewelry - WordPress + WooCommerce Bilingual Project

# Project type and metadata
project:
  type: wordpress-woocommerce
  name: Tu Joyita Miami
  description: Bilingual (Spanish/English) jewelry e-commerce — tujoyita.com
  languages:
    - php (primary)
    - javascript
    - css
    - scss
    - markdown
    - yaml
    - sql

# Framework and dependencies
frameworks:
  - wordpress: "6.9.1"
  - woocommerce: "10.5.1"
  - astra-theme: "4.12.3"
  - elementor: "3.35.4"
  - translatepress: "3.1"

# Infrastructure
infrastructure:
  - docker
  - docker-compose
  - traefik
  - mysql: "8.0"
  - php: "8.1"
  - apache

# Priority files for context
priority_files:
  - README.md
  - PROYECTO-ESTADO.md
  - docker-compose.yml
  - .env.example
  - data/wordpress/wp-content/themes/astra-child/functions.php
  - .github/copilot-instructions.md
  - .github/COPILOT-SKILLS.md

# Patterns to include in context
include_patterns:
  - "*.php"
  - "*.js"
  - "*.css"
  - "*.scss"
  - "*.md"
  - "docker-compose.yml"
  - ".env*"
  - "data/wordpress/wp-content/themes/astra-child/**/*.php"
  - "data/wordpress/wp-content/plugins/jewelry-*/**/*"

# Patterns to exclude from context
exclude_patterns:
  - "data/mysql/**"
  - "data/wordpress/wp-admin/**"
  - "data/wordpress/wp-includes/**"
  - "data/wordpress/wp-content/uploads/**"
  - "data/wordpress/wp-content/cache/**"
  - "data/wordpress/wp-content/plugins/!(jewelry-*)"
  - "node_modules/**"
  - "vendor/**"
  - "*.log"
  - "*.sql"
  - "*.zip"
  - ".git/**"

# Code generation preferences
code_preferences:
  # PHP preferences
  php:
    version: "8.1"
    standards: wordpress
    indentation: 4 spaces
    function_prefix: jewelry_
    class_prefix: Jewelry_
    use_strict_types: false
    phpcs_standard: WordPress
    escaping: always
    sanitization: always
    nonce_verification: always
    use_wp_query: always # Never use direct SQL

  # JavaScript preferences
  javascript:
    version: es6
    indentation: 2 spaces
    use_const_let: true
    no_var: true
    quotes: single

  # CSS preferences
  css:
    indentation: 2 spaces
    naming: kebab-case
    prefix: jewelry-

  # General
  general:
    line_length: 100
    file_encoding: utf-8
    line_endings: lf
    trim_trailing_whitespace: true
    insert_final_newline: true

# Bilingual content rules
bilingual:
  enabled: true
  default_locale: es_ES
  supported_locales:
    - es_ES # Spanish (primary)
    - en_US # English (secondary)
  translation_plugin: translatepress
  single_instance: true # CRITICAL: ONE content instance, translations in wp_trp_* tables
  translate_visually: true # Use TranslatePress visual editor from frontend
  url_prefix_en: /en/ # English URLs have /en/ prefix

# Custom skills available
skills:
  - create_bilingual_product
  - create_bilingual_page
  - import_products_csv
  - bulk_update_prices
  - customize_woocommerce_emails
  - add_checkout_fields
  - create_product_variations
  - execute_wpcli_commands
  - backup_restore_database
  - custom_wp_queries
  - translatepress_visual_editing
  - detect_untranslated_content
  - create_language_switcher
  - custom_gutenberg_blocks
  - rate_limiting_security
  - create_test_data

# Common code snippets
snippets:
  # Product creation (single instance — TranslatePress handles translations)
  create_product: |
    // Create product in Spanish (primary language)
    $product = new WC_Product_Simple();
    $product->set_name( 'Nombre del Producto' );
    $product->set_description( 'Descripción en español' );
    $product->set_regular_price( 499.99 );
    $product->set_sku( 'SKU-001' );
    $product->set_status( 'draft' );
    $product_id = $product->save();
    // English translation: use TranslatePress visual editor
    // Visit: https://jewelry.local.dev/?trp-edit-translation=true

  # Page creation (single instance — TranslatePress handles translations)
  create_page: |
    // Create page in Spanish (primary language)
    $page_id = wp_insert_post(array(
        'post_title' => 'Título de la Página',
        'post_content' => 'Contenido en español',
        'post_type' => 'page',
        'post_status' => 'publish'
    ));
    // English translation: use TranslatePress visual editor
    // Visit: https://jewelry.local.dev/?trp-edit-translation=true

  # WP-CLI in Docker
  wpcli_docker: |
    docker exec jewelry_wordpress php /var/www/html/wp-cli.phar [command] --allow-root

  # Sanitization
  sanitize_input: |
    $text = sanitize_text_field( $_POST['field'] );
    $email = sanitize_email( $_POST['email'] );
    $url = esc_url( $_POST['url'] );

  # Nonce verification
  verify_nonce: |
    if ( ! wp_verify_nonce( $_POST['jewelry_nonce'], 'jewelry_action' ) ) {
        wp_die( 'Unauthorized action' );
    }

# Testing preferences
testing:
  framework: phpunit
  coverage_enabled: false
  test_prefix: test_jewelry_

# Documentation preferences
documentation:
  format: markdown
  inline_comments: phpdoc
  function_docs: required
  class_docs: required

# Git commit preferences
commits:
  format: conventional
  types:
    - feat
    - fix
    - docs
    - style
    - refactor
    - test
    - chore
  require_description: true

# Container information
containers:
  wordpress:
    name: jewelry_wordpress
    image: wordpress:latest
  mysql:
    name: jewelry_mysql
    image: mysql:8.0
  phpmyadmin:
    name: jewelry_phpmyadmin
    image: phpmyadmin:latest

# URLs
urls:
  frontend: https://jewelry.local.dev
  admin: https://jewelry.local.dev/wp-admin
  phpmyadmin: https://phpmyadmin.jewelry.local.dev
  api: https://jewelry.local.dev/wp-json/wp/v2

# Current priorities (from PROYECTO-ESTADO.md)
priorities:
  - Create ~50+ products from WhatsApp catalog (bilingual)
  - Complete About Us / Nosotros page content
  - Complete Materials / Materiales page content
  - Configure WooCommerce emails (bilingual)
  - Install and configure SEO plugin (Yoast/Rank Math)
  - Customize header/footer by language
  - Create blog posts
  - Optimize images
