name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "deploy" para confirmar'
        required: true
        type: string
      mode:
        description: "Modo de operación"
        required: false
        type: choice
        options:
          - deploy
          - check
          - status
        default: deploy

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROD_DIR: /srv/stacks/tujoyita
  SITE_URL: https://tujoyita.com

jobs:
  deploy:
    name: "Deploy (${{ github.event.inputs.mode || 'deploy' }})"
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.mode == 'deploy' && 'production' || '' }}
    steps:
      - name: Confirm deployment
        if: ${{ github.event.inputs.mode == 'deploy' && github.event.inputs.confirm != 'deploy' }}
        run: |
          echo "::error::Deploy cancelado. Debes escribir 'deploy' para confirmar."
          exit 1

      - name: Verify branch
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ "$BRANCH" != "main" ]; then
            echo "::error::Solo se puede desplegar desde main. Branch actual: $BRANCH"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ github.event.inputs.mode == 'deploy' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: ${{ github.event.inputs.mode == 'deploy' }}
        run: npm ci

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat >> ~/.ssh/config <<EOF
          Host tujoyita-prod
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking accept-new
            ConnectTimeout 10
          EOF
          chmod 600 ~/.ssh/config
          ssh tujoyita-prod "echo 'SSH OK'"

      - name: Run deploy-agent.sh
        env:
          PROD_HOST: tujoyita-prod
          PROD_DIR: ${{ env.PROD_DIR }}
        run: |
          chmod +x scripts/deploy-agent.sh
          MODE="${{ github.event.inputs.mode || 'deploy' }}"
          case "$MODE" in
            deploy) FLAG="--force" ;;
            check)  FLAG="--check" ;;
            status) FLAG="--status" ;;
          esac
          bash scripts/deploy-agent.sh $FLAG 2>&1 | tee deploy-output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log-${{ github.run_number }}
          path: deploy-output.txt
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ github.event.inputs.mode || 'deploy' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`$(git log --oneline -1)\`" >> $GITHUB_STEP_SUMMARY
          echo "**Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Unified deploy via \`deploy-agent.sh\` — backup, code sync, containers, health checks" >> $GITHUB_STEP_SUMMARY
