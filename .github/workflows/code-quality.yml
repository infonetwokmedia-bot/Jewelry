name: Code Quality & Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for sensitive files in commits
        run: |
          echo "🔍 Checking for sensitive files..."

          # Check if sensitive files exist in tracked files
          SENSITIVE_FILES=$(git ls-files | grep -E '(^\.env$|credentials|\.bak$|\.backup$)' || true)

          if [ -n "$SENSITIVE_FILES" ]; then
            echo "❌ ERROR: Sensitive files found:"
            echo "$SENSITIVE_FILES"
            exit 1
          else
            echo "✅ No sensitive files found in tracked files"
          fi

      - name: Verify .gitignore is complete
        run: |
          echo "🔍 Verifying .gitignore..."

          # Check critical patterns are in .gitignore
          # data/ or data/mysql/ both protect the database directory
          (grep -q 'data/mysql' .gitignore || grep -q '^data/$' .gitignore) || { echo "❌ Missing: data/mysql/ or data/"; exit 1; }
          grep -q '\.env' .gitignore || { echo "❌ Missing: .env"; exit 1; }
          grep -q '\.wp-credentials' .gitignore || { echo "❌ Missing: .wp-credentials"; exit 1; }

          echo "✅ .gitignore is properly configured"

      - name: Check for hardcoded credentials in code
        run: |
          echo "🔍 Scanning for hardcoded credentials..."

          # Search for potential hardcoded passwords/keys
          FOUND=$(grep -r -i -E '(password|passwd|pwd|secret|api_key|apikey|token)[\s]*=[\s]*["\047][^"\047]{8,}["\047]' \
            --include="*.php" \
            --include="*.js" \
            --exclude-dir=node_modules \
            --exclude-dir=vendor \
            --exclude-dir=data \
            . || true)

          if [ -n "$FOUND" ]; then
            echo "⚠️  WARNING: Potential hardcoded credentials found:"
            echo "$FOUND"
            echo ""
            echo "Please review these findings. If false positives, add to exclusion list."
          else
            echo "✅ No hardcoded credentials detected"
          fi

  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none

      - name: PHP Syntax Check - Custom Plugins
        run: |
          echo "🔍 Checking PHP syntax in custom plugins..."

          # Check jewelry-dashboard plugin (tracked in git)
          if [ -d "data/wordpress/wp-content/plugins/jewelry-dashboard" ]; then
            find data/wordpress/wp-content/plugins/jewelry-dashboard -name "*.php" -exec php -l {} \;
            echo "✅ jewelry-dashboard plugin syntax OK"
          else
            echo "⚠️  jewelry-dashboard plugin not found"
          fi

          # Check any other jewelry-* plugins
          if [ -d "data/wordpress/wp-content/plugins/jewelry-custom" ]; then
            find data/wordpress/wp-content/plugins/jewelry-custom -name "*.php" -exec php -l {} \;
            echo "✅ jewelry-custom plugin syntax OK"
          fi

      - name: PHP Syntax Check - Scripts
        run: |
          echo "🔍 Checking PHP syntax in scripts..."

          find scripts -name "*.php" -exec php -l {} \; 2>/dev/null || echo "No PHP files in scripts/"

          echo "✅ Scripts syntax check complete"

      - name: PHP Syntax Check - MU-Plugins
        run: |
          echo "🔍 Checking PHP syntax in mu-plugins..."

          if [ -d "data/wordpress/wp-content/mu-plugins" ]; then
            find data/wordpress/wp-content/mu-plugins -name "*.php" -exec php -l {} \;
            echo "✅ MU-plugins syntax OK"
          else
            echo "⚠️ No mu-plugins directory found"
          fi

  phpcs:
    name: PHP CodeSniffer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: phpcs
          coverage: none

      - name: Install WordPress Coding Standards
        run: |
          composer global require --dev wp-coding-standards/wpcs:"^3.0" --no-interaction
          phpcs --config-set installed_paths $(composer global config home)/vendor/wp-coding-standards/wpcs

      - name: Check custom code with PHPCS
        run: |
          echo "🔍 Checking WordPress coding standards..."

          TARGETS=""
          [ -d "data/wordpress/wp-content/mu-plugins" ] && TARGETS="$TARGETS data/wordpress/wp-content/mu-plugins/"
          [ -d "data/wordpress/wp-content/plugins/jewelry-dashboard" ] && TARGETS="$TARGETS data/wordpress/wp-content/plugins/jewelry-dashboard/"
          [ -d "data/wordpress/wp-content/plugins/jewelry-custom" ] && TARGETS="$TARGETS data/wordpress/wp-content/plugins/jewelry-custom/"
          [ -d "data/wordpress/wp-content/themes/astra-child" ] && TARGETS="$TARGETS data/wordpress/wp-content/themes/astra-child/"

          if [ -n "$TARGETS" ]; then
            phpcs --standard=WordPress-Core --extensions=php \
              --ignore=*/vendor/*,*/node_modules/* \
              --warning-severity=0 \
              $TARGETS || echo "⚠️ PHPCS found issues (non-blocking)"
          else
            echo "ℹ️ No custom PHP code to check"
          fi
        continue-on-error: true

  php-tests:
    name: PHP Unit Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: mysqli, pdo_mysql, mbstring, intl
          tools: phpunit
          coverage: none

      - name: Check for test files
        id: check-tests
        run: |
          if find tests/php -name "test-*.php" -o -name "Test*.php" 2>/dev/null | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "✅ PHP test files found"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No PHP test files found - skipping tests"
          fi

      - name: Install WordPress test suite
        if: steps.check-tests.outputs.has_tests == 'true'
        run: |
          mkdir -p /tmp/wordpress-tests-lib
          svn co --quiet https://develop.svn.wordpress.org/tags/6.9.1/tests/phpunit/includes/ /tmp/wordpress-tests-lib/includes
          svn co --quiet https://develop.svn.wordpress.org/tags/6.9.1/tests/phpunit/data/ /tmp/wordpress-tests-lib/data

      - name: Create wp-tests-config.php
        if: steps.check-tests.outputs.has_tests == 'true'
        run: |
          cat > /tmp/wordpress-tests-lib/wp-tests-config.php << 'EOF'
          <?php
          define( 'DB_NAME', 'wordpress_test' );
          define( 'DB_USER', 'root' );
          define( 'DB_PASSWORD', 'root' );
          define( 'DB_HOST', '127.0.0.1' );
          define( 'DB_CHARSET', 'utf8' );
          define( 'DB_COLLATE', '' );
          define( 'WP_TESTS_DOMAIN', 'example.org' );
          define( 'WP_TESTS_EMAIL', 'admin@example.org' );
          define( 'WP_TESTS_TITLE', 'Test Blog' );
          define( 'WP_PHP_BINARY', 'php' );
          define( 'ABSPATH', '/tmp/wordpress/' );
          EOF

      - name: Run PHPUnit tests
        if: steps.check-tests.outputs.has_tests == 'true'
        run: |
          echo "Running PHP unit tests..."
          phpunit --configuration tests/php/phpunit.xml --testdox 2>/dev/null || \
          phpunit tests/php/ --testdox
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib

      - name: Tests skipped notice
        if: steps.check-tests.outputs.has_tests == 'false'
        run: |
          echo "ℹ️ No PHP tests found. Add tests under tests/php/ to enable this job."

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for E2E test files
        id: check-e2e
        run: |
          if find tests/e2e -name "*.spec.js" -o -name "*.spec.ts" 2>/dev/null | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "✅ E2E test files found"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No E2E test files found - skipping"
          fi

      - name: Setup Node.js
        if: steps.check-e2e.outputs.has_tests == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.check-e2e.outputs.has_tests == 'true'
        run: |
          if [ -f "package.json" ]; then
            npm ci
          else
            npm init -y
            npm install @playwright/test
          fi

      - name: Install Playwright browsers
        if: steps.check-e2e.outputs.has_tests == 'true'
        run: npx playwright install --with-deps chromium

      - name: Start WordPress environment
        if: steps.check-e2e.outputs.has_tests == 'true'
        run: |
          docker compose -f .github/workflows/docker-compose.ci.yml up -d
          timeout 120 bash -c 'until curl -f http://localhost:8080/wp-admin/install.php; do sleep 2; done'

      - name: Run E2E tests
        if: steps.check-e2e.outputs.has_tests == 'true'
        run: npx playwright test tests/e2e/ --reporter=list
        env:
          BASE_URL: http://localhost:8080

      - name: Cleanup
        if: steps.check-e2e.outputs.has_tests == 'true' && always()
        run: docker compose -f .github/workflows/docker-compose.ci.yml down -v

      - name: E2E tests skipped notice
        if: steps.check-e2e.outputs.has_tests == 'false'
        run: |
          echo "ℹ️ No E2E tests found. Add tests under tests/e2e/ to enable this job."

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !data/**
            !node_modules/**

  repo-structure:
    name: Repository Structure Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          echo "🔍 Checking required files..."

          # Required files
          REQUIRED_FILES=(
            "README.md"
            "PROYECTO-ESTADO.md"
            ".gitignore"
            ".editorconfig"
            "docker-compose.yml"
            ".env.example"
          )

          MISSING=()
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              MISSING+=("$file")
            fi
          done

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "❌ Missing required files:"
            printf '%s\n' "${MISSING[@]}"
            exit 1
          else
            echo "✅ All required files present"
          fi

      - name: Verify directory structure
        run: |
          echo "🔍 Checking directory structure..."

          # Required directories
          REQUIRED_DIRS=(
            ".github"
            ".github/agents"
            ".ai-tools"
            "scripts"
            "docs"
          )

          MISSING=()
          for dir in "${REQUIRED_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              MISSING+=("$dir")
            fi
          done

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "❌ Missing required directories:"
            printf '%s\n' "${MISSING[@]}"
            exit 1
          else
            echo "✅ All required directories present"
          fi

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs:
      [
        security-audit,
        php-lint,
        phpcs,
        php-tests,
        e2e-tests,
        markdown-lint,
        repo-structure,
      ]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "📊 CI/CD Summary"
          echo "================"
          echo ""
          echo "Security Audit: ${{ needs.security-audit.result }}"
          echo "PHP Lint: ${{ needs.php-lint.result }}"
          echo "PHP Tests: ${{ needs.php-tests.result }}"
          echo "PHPCS: ${{ needs.phpcs.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "Markdown Lint: ${{ needs.markdown-lint.result }}"
          echo "Repo Structure: ${{ needs.repo-structure.result }}"
          echo ""

          if [[ "${{ needs.security-audit.result }}" == "failure" ]] || \
             [[ "${{ needs.php-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.phpcs.result }}" == "failure" ]] || \
             [[ "${{ needs.php-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.e2e-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.markdown-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.repo-structure.result }}" == "failure" ]]; then
            echo "❌ Some checks failed. Please review the logs above."
            exit 1
          else
            echo "✅ All checks passed!"
          fi
